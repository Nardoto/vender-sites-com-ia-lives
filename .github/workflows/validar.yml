name: Validar conteúdo

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar os JSON de conteúdo
        run: |
          for f in conteudo/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "JSON inválido: $f"; exit 1; }
          done
      - name: Gerar o site e conferir a transcrição
        run: node gerar.js
      - name: Conferir o JavaScript
        run: node --check assets/app.js
